name: Supabase Keep Alive

on:
  schedule:
    # 每天的 0点 和 12点（UTC时间）自动运行一次，也就是每12小时唤醒一次
    - cron: '0 */12 * * *'
  # 允许你在 GitHub 页面上手动点击运行测试
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase Rest API
        env:
          SUPABASE_URL: ${{ secrets.PUBLIC_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.PUBLIC_SUPABASE_ANON_KEY }}
        run: |
          # 针对 Supabase 的自带健康检查或默认 REST 路由发起一次轻量请求
          curl -s -o /dev/null -w "%{http_code}" \
            -X GET "$SUPABASE_URL/rest/v1/" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY"
